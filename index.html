<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101522">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-labelledby="title">
        <header class="calculator__header">
          <div>
            <p class="eyebrow">Everyday math</p>
            <h1 id="title">Calculator</h1>
          </div>
          <span class="calculator__badge" aria-label="Four-function calculator">01</span>
        </header>

        <div class="display" aria-live="polite" aria-atomic="true">
          <p class="display__expression" id="expression"></p>
          <output class="display__value" id="display" aria-label="Calculator display">0</output>
        </div>

        <div class="keypad" role="group" aria-label="Calculator keys">
          <button class="key key--utility" type="button" data-action="clear" aria-label="Clear">AC</button>
          <button class="key key--utility" type="button" data-action="backspace" aria-label="Backspace">⌫</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="/" aria-label="Divide">÷</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="*" aria-label="Multiply">×</button>

          <button class="key" type="button" data-action="digit" data-value="7">7</button>
          <button class="key" type="button" data-action="digit" data-value="8">8</button>
          <button class="key" type="button" data-action="digit" data-value="9">9</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="-">−</button>

          <button class="key" type="button" data-action="digit" data-value="4">4</button>
          <button class="key" type="button" data-action="digit" data-value="5">5</button>
          <button class="key" type="button" data-action="digit" data-value="6">6</button>
          <button class="key key--operator" type="button" data-action="operator" data-value="+">+</button>

          <button class="key" type="button" data-action="digit" data-value="1">1</button>
          <button class="key" type="button" data-action="digit" data-value="2">2</button>
          <button class="key" type="button" data-action="digit" data-value="3">3</button>
          <button class="key key--equals" type="button" data-action="equals" aria-label="Equals">=</button>

          <button class="key key--utility" type="button" data-action="sign" aria-label="Change sign">±</button>
          <button class="key key--zero" type="button" data-action="digit" data-value="0">0</button>
          <button class="key key--utility" type="button" data-action="decimal" aria-label="Decimal point">.</button>
        </div>

        <p class="calculator__hint">Use your keyboard or tap the keys</p>
      </section>
    </main>
  </body>
</html>
